<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>EcoSlice</title>

    <link
        rel="stylesheet"
        href="ecoslice.css"
    >

</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div>

            <div class="brand">

                <span class="logo">
                    ◉
                </span>

                EcoSlice

            </div>

            <div class="subtitle">

                AI-assisted material, energy,
                and strength optimization

            </div>

        </div>


        <div class="version">

            v0.2.0

        </div>

    </header>



    <!-- INTENT -->

    <section class="section">

        <div class="section-title">

            <span class="number">
                01
            </span>

            Describe the part

        </div>


        <textarea
            id="intent"
            placeholder="Example: A garden hose holder. It supports 1 kg outdoors. Strength matters more than appearance."
        ></textarea>


        <button
            id="analyze"
            class="analyze-button"
        >

            Analyze current model

        </button>


        <div
            id="status"
            class="status"
        ></div>

    </section>



    <!-- GEOMETRY -->

    <section
        id="results"
        class="hidden"
    >

        <div class="section">

            <div class="section-title">

                <span class="number">
                    02
                </span>

                Geometry

            </div>


            <div class="metrics">


                <div class="metric">

                    <div class="metric-label">
                        Volume
                    </div>

                    <div
                        class="metric-value"
                        id="volume"
                    >
                        —
                    </div>

                    <div class="metric-unit">
                        mm³
                    </div>

                </div>


                <div class="metric">

                    <div class="metric-label">
                        Triangles
                    </div>

                    <div
                        class="metric-value"
                        id="triangles"
                    >
                        —
                    </div>

                    <div class="metric-unit">
                        mesh faces
                    </div>

                </div>


                <div class="metric">

                    <div class="metric-label">
                        Support Risk
                    </div>

                    <div
                        class="metric-value"
                        id="risk"
                    >
                        —
                    </div>

                    <div class="metric-unit">
                        estimated
                    </div>

                </div>


            </div>

        </div>



        <!-- ENGINEERING INTENT -->

        <div class="section">

            <div class="section-title">

                <span class="number">
                    03
                </span>

                Engineering Intent

            </div>


            <div class="intent-card">


                <div class="intent-row">

                    <span>
                        Priority
                    </span>

                    <strong
                        id="priority"
                    >
                        —
                    </strong>

                </div>


                <div class="intent-row">

                    <span>
                        Load
                    </span>

                    <strong
                        id="load"
                    >
                        —
                    </strong>

                </div>


                <div class="intent-row">

                    <span>
                        Outdoor
                    </span>

                    <strong
                        id="outdoor"
                    >
                        —
                    </strong>

                </div>


                <div class="intent-row">

                    <span>
                        Vibration
                    </span>

                    <strong
                        id="vibration"
                    >
                        —
                    </strong>

                </div>


            </div>

        </div>



        <!-- WARNINGS -->

        <div
            id="warnings"
            class="warnings"
        ></div>



        <!-- OPTIONS -->

        <div class="section">

            <div class="section-title">

                <span class="number">
                    04
                </span>

                Optimization

            </div>


            <div
                id="options"
                class="options"
            ></div>

        </div>



        <!-- CHANGES -->

        <div class="section">

            <div class="section-title">

                <span class="number">
                    05
                </span>

                What EcoSlice Changes

            </div>


            <div
                id="explanation"
                class="changes"
            ></div>

        </div>



        <!-- FINAL BUTTON -->

        <div class="footer">

            <button
                id="optimize"
                class="optimize-button"
            >

                ✨ Optimize with EcoSlice

            </button>

        </div>


    </section>


</div>


<script src="ecoslice.js"></script>

</body>

</html>
